[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeguard-shared"
version = "0.1.0"
description = "Shared models, database primitives, and event schemas for TradeGuard Azure MVP"
authors = [{ name = "TradeGuard Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0"
]
